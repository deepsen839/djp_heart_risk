[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "djp-heart-risk-demo"
version = "1.0.0"
description = "Responsible research-only heart disease ML proof of concept for the HackBase DJP assignment"
requires-python = ">=3.10,<3.14"
dependencies = [
  "numpy>=1.24,<3", "pandas>=2.0,<3", "scikit-learn>=1.3,<2",
  "joblib>=1.3,<2", "matplotlib>=3.7,<4", "seaborn>=0.13,<1",
  "fastapi>=0.110,<1", "uvicorn[standard]>=0.27,<1", "pydantic>=2.6,<3",
  "ucimlrepo>=0.0.7,<1", "xgboost>=2.0,<4", "shap>=0.45,<1"
]

[project.optional-dependencies]
ui = ["streamlit>=1.35,<2", "requests>=2.31,<3"]
dev = ["pytest>=8,<9", "httpx>=0.27,<1", "ruff>=0.5,<1"]
mlops = ["mlflow==2.17.2","prometheus-client>=0.20,<1"]
features = ["feast>=0.40,<1", "pyarrow>=14,<20"]

[project.scripts]
djp-audit = "djp_heart_risk.audit:main"
djp-train = "djp_heart_risk.train:main"
djp-evaluate = "djp_heart_risk.evaluate:main"
djp-explain = "djp_heart_risk.explain:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
